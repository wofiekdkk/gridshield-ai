version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: gridshield_db
    environment:
      POSTGRES_USER: gridshield
      POSTGRES_PASSWORD: gridshield123
      POSTGRES_DB: gridshield_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
